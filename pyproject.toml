[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "artifactr"
version = "0.3.3"
description = "Manage AI artifacts across multiple configurations, tools, & repositories"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
art = "artifactr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/reg1z/artifactr"
Issues = "https://github.com/reg1z/artifactr/issues"
