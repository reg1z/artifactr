[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "artifactr"
version = "0.0.1"
description = "CLI tool for managing AI project artifacts across repositories"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "textual>=0.50",
]

[project.scripts]
art = "artifactr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/reg1z/artifactr"
Issues = "https://github.com/reg1z/artifactr/issues"
