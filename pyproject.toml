[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "artifactr"
version = "0.1.0"
description = "CLI tool for managing AI project artifacts across repositories"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
art = "artifactr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
